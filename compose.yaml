services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aeroreserva
      POSTGRES_USER: aeroreserva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aeroreserva_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroreserva -d aeroreserva"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  aeroreserva_data:
